<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <!-- header -->
    <header class="logo-container">
        <div class="container">
            <div class="logo">
                <img src="/assets/images/601511463-a85ab1da-9c64-4ead-a9a9-eb94a7093d4c.png" alt="logo">
                <span>Bookly</span>
            </div>
        </div>
    </header>

    <!-- Register form -->
     <main class="main-box">
            <div class="card">
                <h2>Create Account</h2>
                <p class="card-text">
                    Join Gutenlib to start your reading journey today.
                </p>

                <form action="#">
                    <div class="box">
                        <label>Full Name</label>
                        <div class="field">
                         <i class="fa-regular fa-user"></i>
                            <input type="text" placeholder="Shucayb" required>
                        </div>
                    </div>
                    <div class="box">
                        <div class="row">
                        <label>Email Address</label>
                        </div>
                        <div class="field">
                       <i class="fa-regular fa-envelope"></i>
                            <input type="email" placeholder="email@example.com" required>
                           </div>
                        </div>
                            <div class="box">
                              <div class="row">
                               <label>Password</label>
                         </div>
                              <div class="field">
                                 <i class="fa-solid fa-lock"></i>
                                  <input type="password" placeholder="••••••••" required>
                                  <i class="fas fa-eye eye-icon"></i>
                              </div>
                            </div>
                            <div class="box">
                              <div class="row">
                               <label>Confirm Password</label>
                         </div>
                              <div class="field">
                                 <i class="fa-solid fa-clock-rotate-left"></i>
                                  <input type="password" placeholder="••••••••" required>
                              </div>
                            </div>
                        <button type="submit" class="btn">
                            Create Account  <i class="fa-solid fa-arrow-right"></i>
                        </button>
                </form>
                <p class="reg-text">Already have an account? <a href="#">Login</a></p>
            </div>
     </main>

        <!-- footer -->
     <section class="footer">
        <p class="Copy">&copy; 2024 GutenLib Digital Library. All rights reserved.</p>
        <div class="Links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Support</a>
        </div>
     </section>
</body>
</html>
